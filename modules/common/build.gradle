plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = rootProject.neoform_version
}

dependencies {
    // Mixin for compile-time processing
    compileOnly "org.spongepowered:mixin:0.8.7"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

    // Cloth Config API (compile-only in common, using NeoForge variant for Mojmap compatibility)
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    // LambDynamicLights API (compile-only, mojmap variant for NeoForm compatibility)
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${rootProject.lambdynamiclights_version}:mojmap"
}
